# (2026-11-28) Test sürümlerinin veritabanı ayrı: bir kerelik kopya.
#  - Uygulama Merkezi: um/ → umtest/ (test mağazası …/uygulama-merkezi/test/ artık umtest kökünü kullanır)
#  - Skorbord: skorbord/ → test/skorbord/ (Skorbord Test ve test admin artık orayı kullanır)
# Hedef zaten varsa hiçbir şey yazılmaz (test verisinin üzerine yazılmaz). Yükleme parçaları ve bildirim kuyruğu kopyalanmaz.
name: Test veritabani ayir (bir kerelik kopya)
on:
  push:
    branches: [main]
    paths: [.github/workflows/veri-ayir.yml]
  workflow_dispatch:
jobs:
  kopyala:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Kopyala
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd "$RUNNER_TEMP" && npm i --silent firebase-admin@12 >/dev/null 2>&1
          NODE_PATH="$RUNNER_TEMP/node_modules" node "$GITHUB_WORKSPACE/.github/scripts/veri-ayir.js"
