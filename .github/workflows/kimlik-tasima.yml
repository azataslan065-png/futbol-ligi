# Kalan düz şifreli profilleri Firebase kimlik sistemine taşır (yalnızca elle: Actions > Run workflow).
name: Kimlik toplu tasima
on:
  workflow_dispatch:
    inputs:
      ortam:
        description: 'test ya da kok'
        default: 'test'
      deneme:
        description: '1 = yalnızca say, yazma; 0 = gerçekten taşı'
        default: '1'
jobs:
  tasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Anahtari hazirla
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node .github/scripts/anahtar-onar.js "$RUNNER_TEMP/sa.json"
      - name: Tasi
        env:
          ORTAM: ${{ github.event.inputs.ortam }}
          DENEME: ${{ github.event.inputs.deneme }}
        run: |
          cd "$RUNNER_TEMP" && npm i --silent firebase-admin@12 >/dev/null 2>&1 && cd "$GITHUB_WORKSPACE"
          NODE_PATH="$RUNNER_TEMP/node_modules" node .github/scripts/kimlik-tasima.js
