# Lig kurallari metnini TEST veritabanina yazar (yalnizca test/leagues ve test/sahaVeri/leagues; kok veriye dokunmaz).
name: Lig kurallari yaz (test)
on:
  push:
    branches: [main]
    paths: [.github/workflows/ligkural-yaz.yml, .github/ligkural/kurallar.txt, .github/ligkural/yaz.js]
  workflow_dispatch:
jobs:
  yaz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Yaz
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node .github/scripts/anahtar-onar.js "$RUNNER_TEMP/sa.json" >/dev/null 2>&1 || true
          mkdir -p /tmp/t && cd /tmp/t && npm init -y >/dev/null && npm i --silent google-auth-library@9 >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/.github/ligkural/yaz.js" . && node yaz.js
          rm -f "$RUNNER_TEMP/sa.json"
