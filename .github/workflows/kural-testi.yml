# Firebase kural testleri: kurallar Realtime Database öykünücüsünde senaryolarla denenir (gerçek veritabanına dokunmaz).
# Ana daldaki yayın işi de aynı testleri yayından önce çalıştırır; bu iş dallarda ve elle denemek içindir.
name: Kural testleri
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [database.rules.json, .github/kural-testi/**, .github/workflows/kural-testi.yml]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Bağımlılıklar
        run: cd .github/kural-testi && npm install --no-audit --no-fund --loglevel=error
      - name: Öykünücüde kural testleri
        run: npx --yes firebase-tools@13 emulators:exec --only database --project demo-saha "node .github/kural-testi/test.js"
