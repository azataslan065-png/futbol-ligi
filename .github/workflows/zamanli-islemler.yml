# Admin panelinde zamanlanan işlemleri (duyurular) vakti gelince yapar - panel kapalıyken de.
# 5 dakikada bir çalışır; GitHub zamanlanmış görevleri birkaç dakika gecikebilir.
name: Zamanlanmis islemler
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: zamanli-islemler
  cancel-in-progress: false
jobs:
  isle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kuyrugu isle
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd "$RUNNER_TEMP" && npm i --silent firebase-admin@12 >/dev/null 2>&1
          NODE_PATH="$RUNNER_TEMP/node_modules" node "$GITHUB_WORKSPACE/.github/scripts/zamanli.js"
