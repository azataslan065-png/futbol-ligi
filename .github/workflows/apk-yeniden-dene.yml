# Geçici: uygulama "Çık" ile kapatılıp aynı işlem açıkken yeniden açılınca sayfa yükleniyor mu (kullanıcı: güncelleme sonrası boş ekran).
name: APK yeniden ac dene
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/apk-yeniden-dene.yml]
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: APK indir
        env: { GH_TOKEN: '${{ github.token }}' }
        run: mkdir -p /tmp/a && gh release download apk -R ${{ github.repository }} -p Puan-Tablosu.apk -D /tmp/a
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p /tmp/r; adb logcat -c; adb install -r /tmp/a/Puan-Tablosu.apk
            adb shell monkey -p com.azat.puantablosu -c android.intent.category.LAUNCHER 1 >/dev/null; sleep 35; adb exec-out screencap -p > /tmp/r/1-ilk.png
            adb shell input keyevent KEYCODE_BACK; sleep 3; adb shell uiautomator dump /sdcard/u.xml >/dev/null; adb pull /sdcard/u.xml /tmp/r/u.xml >/dev/null; B=$(grep -o 'text="Çık"[^>]*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' /tmp/r/u.xml | grep -o '\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]' | head -1 | tr -d '[' | tr ']' ','); X=$(echo "$B" | awk -F, '{print int(($1+$3)/2)}'); Y=$(echo "$B" | awk -F, '{print int(($2+$4)/2)}'); echo "cik $B $X $Y" > /tmp/r/not.txt; if [ -n "$B" ]; then adb shell input tap $X $Y; fi; sleep 6
            adb shell pidof com.azat.puantablosu >> /tmp/r/not.txt || echo "islem yok" >> /tmp/r/not.txt
            adb shell monkey -p com.azat.puantablosu -c android.intent.category.LAUNCHER 1 >/dev/null; sleep 35; adb exec-out screencap -p > /tmp/r/2-yeniden.png
            adb shell input keyevent KEYCODE_HOME; sleep 3; adb shell monkey -p com.azat.puantablosu -c android.intent.category.LAUNCHER 1 >/dev/null; sleep 10; adb exec-out screencap -p > /tmp/r/3-donus.png
            adb logcat -d | grep -iE "chromium|AndroidRuntime|azat|FATAL|console|ServiceWorker" | tail -400 > /tmp/r/logcat.txt || true
      - name: Sonucu yaz
        if: always()
        run: |
          cd /tmp/r && git init -q && git checkout -q -b apk-yeniden-dene && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "dene $(date -u +%FT%TZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-yeniden-dene
