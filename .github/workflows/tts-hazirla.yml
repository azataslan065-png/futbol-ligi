# Piper (açık kaynak sinir ağı ses sentezi) için Türkçe sesleri ve tarayıcı çalışma dosyalarını indirir, örnek cümleleri
# seslendirir (v2) ve "tts-paket" dalına koyar. Yayın yapmaz; yalnızca inceleme ve deneme içindir.
name: TTS paketi hazirla
on:
  push:
    branches: [main]
    paths: [.github/workflows/tts-hazirla.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hazirla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sesleri indir
        run: |
          mkdir -p /tmp/p/ses /tmp/p/ornek /tmp/p/npm && cd /tmp/p/ses
          for v in dfki fahrettin fettah; do
            for e in onnx onnx.json; do curl -sSfL -o tr_TR-$v-medium.$e "https://huggingface.co/rhasspy/piper-voices/resolve/main/tr/tr_TR/$v/medium/tr_TR-$v-medium.$e" || curl -sSfL -o tr_TR-$v-medium.$e "https://huggingface.co/diffusionstudio/piper-voices/resolve/main/tr/tr_TR/$v/medium/tr_TR-$v-medium.$e" || echo "yok: $v $e"; done
          done
          curl -sSfL -o MODEL_CARD_dfki "https://huggingface.co/rhasspy/piper-voices/resolve/main/tr/tr_TR/dfki/medium/MODEL_CARD" || true
          curl -sSfL -o MODEL_CARD_fahrettin "https://huggingface.co/rhasspy/piper-voices/resolve/main/tr/tr_TR/fahrettin/medium/MODEL_CARD" || true
          curl -sSfL -o MODEL_CARD_fettah "https://huggingface.co/rhasspy/piper-voices/resolve/main/tr/tr_TR/fettah/medium/MODEL_CARD" || true
          ls -la
      - name: Ornek cumleler
        run: |
          pip install -q piper-tts onnxruntime onnx 2>&1 | tail -1
          cd /tmp/p
          cat > cumle.txt <<'C'
          Ve başlıyoruz! Kartallar ile Aslanlar arasındaki mücadelede ilk düdük çaldı.
          Yılmaz ceza sahası dışından şutunu çekiyor! Top üst direğin hemen üstünden auta gidiyor.
          Goool! Demir sol çaprazdan uzak köşeye vurdu, kaleci çaresiz! Skor bir-sıfır!
          Kaleci son anda bacağını uzattı, müthiş bir kurtarış!
          Hakem oyunu durdurdu, faul var. Sarı kart çıkıyor.
          Bence orta sahada Aslanlar daha üstün, bu baskı golü getirebilir.
          C
          for v in dfki fahrettin fettah; do
            [ -f ses/tr_TR-$v-medium.onnx ] || continue
            i=0; while IFS= read -r c; do i=$((i+1)); echo "$c" | python -m piper -m ses/tr_TR-$v-medium.onnx -f ornek/$v-$i.wav 2>/dev/null || echo "$c" | piper -m ses/tr_TR-$v-medium.onnx -f ornek/$v-$i.wav; done < cumle.txt
            python - <<P
          import onnx
          from onnxruntime.quantization import quantize_dynamic, QuantType
          quantize_dynamic('ses/tr_TR-$v-medium.onnx','ses/tr_TR-$v-medium.int8.onnx',weight_type=QuantType.QUInt8)
          P
            i=0; while IFS= read -r c; do i=$((i+1)); echo "$c" | python -m piper -m ses/tr_TR-$v-medium.int8.onnx -c ses/tr_TR-$v-medium.onnx.json -f ornek/$v-int8-$i.wav 2>/dev/null || true; done < cumle.txt
          done
          sudo apt-get install -y -q ffmpeg >/dev/null 2>&1 || true
          for f in ornek/*.wav; do ffmpeg -v error -y -i "$f" -b:a 64k "${f%.wav}.mp3" && rm "$f"; done
          ls -la ornek ses
      - name: Tarayici calisma dosyalari
        run: |
          cd /tmp/p/npm
          for p in @mintplex-labs/piper-tts-web @diffusionstudio/piper-wasm@1.0.0 onnxruntime-web@1.18.0; do npm pack --silent "$p" || echo "paket yok: $p"; done
          for f in *.tgz; do mkdir -p "${f%.tgz}" && tar -xzf "$f" -C "${f%.tgz}"; done
          rm -f *.tgz; du -sh *; find . -maxdepth 4 -type d | head -50
      - name: Dala yaz
        run: |
          cd /tmp/p && rm -rf npm/*/package/node_modules
          git init -q && git checkout -q -b tts-paket
          git config user.name github-actions; git config user.email actions@github.com
          git lfs install >/dev/null 2>&1 || true
          find . -size +95M -type f -print -delete
          git add -A && git commit -qm "TTS paketi $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tts-paket
