# Geçici: gömülü YouTube reklam ayıklayıcısını gerçek YouTube'a karşı dener (çıktı çalışma günlüğünde).
name: YT dene
on:
  push:
    branches: [main]
    paths: [.github/workflows/yt-dene.yml, .github/ytdene/**]
  workflow_dispatch:
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd .github/ytdene && npm init -y >/dev/null && npm i --silent playwright@1.48.2 && npx playwright install --with-deps chromium >/dev/null 2>&1 && node dene.js
