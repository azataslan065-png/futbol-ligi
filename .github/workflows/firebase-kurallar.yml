# Firebase Realtime Database kurallarını otomatik yayınlar.
# database.rules.json ana dalda her değiştiğinde (ya da Actions sekmesinden elle "Run workflow" ile) çalışır.
# Gerekli gizli anahtar: FIREBASE_SERVICE_ACCOUNT (Firebase → Proje ayarları → Hizmet hesapları → Yeni özel anahtar, JSON içeriği).
name: Firebase kurallarini yayinla
on:
  push:
    branches: [main]
    paths: [database.rules.json, firebase.json, .github/workflows/firebase-kurallar.yml]
  workflow_dispatch:
jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kurallari dogrula
        run: node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8')); console.log('JSON gecerli')"
      - name: Yayinla
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT gizli anahtari eklenmemis (Settings > Secrets and variables > Actions)."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only database --project superlig-208e3 --non-interactive
      - name: Yayinlanan kurallari Firebase'den geri oku ve karsilastir
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd "$RUNNER_TEMP" && npm i --silent google-auth-library@9 >/dev/null 2>&1
          node -e '
            const {GoogleAuth}=require("google-auth-library"); const fs=require("fs");
            (async()=>{
              const auth=new GoogleAuth({credentials:JSON.parse(process.env.SA),scopes:["https://www.googleapis.com/auth/firebase.database","https://www.googleapis.com/auth/userinfo.email"]});
              const tok=(await (await auth.getClient()).getAccessToken()).token;
              const r=await fetch("https://superlig-208e3-default-rtdb.europe-west1.firebasedatabase.app/.settings/rules.json",{headers:{Authorization:"Bearer "+tok}});
              const metin=await r.text();
              if(!r.ok){ console.log("::error::Kurallar okunamadi: HTTP "+r.status+" "+metin.slice(0,200)); process.exit(1); }
              const temiz=t=>JSON.stringify(JSON.parse(t.replace(/\/\/.*$/mg,"")));
              const ayni=temiz(metin)===temiz(fs.readFileSync(process.env.GITHUB_WORKSPACE+"/database.rules.json","utf8"));
              const dal=metin.includes("_dalKaydi");
              console.log((ayni?"::notice::":"::error::")+"Firebase kurallari depodakiyle "+(ayni?"BIREBIR AYNI":"FARKLI")+" | _dalKaydi "+(dal?"VAR":"YOK")+" | "+new Date().toISOString());
              if(!ayni) process.exit(1);
            })().catch(e=>{ console.log("::error::"+e.message); process.exit(1); });
          '
