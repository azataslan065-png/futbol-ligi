# Firebase Realtime Database kurallarını otomatik yayınlar.
# database.rules.json ana dalda her değiştiğinde (ya da Actions sekmesinden elle "Run workflow" ile) çalışır.
# Gerekli gizli anahtar: FIREBASE_SERVICE_ACCOUNT (Firebase → Proje ayarları → Hizmet hesapları → Yeni özel anahtar, JSON içeriği).
name: Firebase kurallarini yayinla
on:
  push:
    branches: [main]
    paths: [database.rules.json, firebase.json, .github/workflows/firebase-kurallar.yml]
  workflow_dispatch:
jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kurallari dogrula
        run: node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8')); console.log('JSON gecerli')"
      - name: Yayinla
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT gizli anahtari eklenmemis (Settings > Secrets and variables > Actions)."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          # Anahtarin bicimi denetlenir; anahtarin kendisi ASLA yazdirilmaz, yalnizca teshis bilgisi.
          node -e '
            const t=require("fs").readFileSync(process.argv[1],"utf8"); let j;
            try{ j=JSON.parse(t); }catch(e){
              const m=String(e.message).match(/position (\d+)/), p=m?+m[1]:-1;
              const tur=c=>{ if(c==null) return "yok"; const k=c.charCodeAt(0); return k<32?"kontrol("+k+")":k>126?"ozel(U+"+k.toString(16)+")":(/[A-Za-z0-9+\/=]/.test(c)?"harf/rakam":"isaret("+k+")"); };
              const satir=p>=0?t.slice(0,p).split("\n").length:-1;
              const ozel=[...t].filter(c=>c.charCodeAt(0)>126).length, kontrol=[...t].filter(c=>{const k=c.charCodeAt(0);return k<32&&k!==10&&k!==13;}).length;
              console.log("::error::Anahtar gecerli JSON degil | uzunluk "+t.length+" | satir "+t.split("\n").length+" | hata konumu "+p+" (satir "+satir+") | o noktadaki karakter: "+tur(t[p])+" | onceki: "+tur(t[p-1])+" | ASCII disi karakter sayisi "+ozel+" | kontrol karakteri "+kontrol+" | mesaj: "+String(e.message).replace(/["{}]/g,"").slice(0,120));
              process.exit(1); }
            const pk=String(j.private_key||"");
            const sorun=[]; if(j.type!=="service_account") sorun.push("type service_account degil"); if(j.project_id!=="superlig-208e3") sorun.push("project_id farkli: "+j.project_id);
            if(!/BEGIN PRIVATE KEY/.test(pk)||!/END PRIVATE KEY/.test(pk)) sorun.push("private_key eksik/bozuk (uzunluk "+pk.length+")"); if(!j.client_email) sorun.push("client_email yok");
            console.log((sorun.length?"::error::Anahtar bicimi hatali: "+sorun.join("; "):"::notice::Anahtar bicimi gecerli")+" | anahtar "+String(j.private_key_id||"").slice(0,8));
            if(sorun.length) process.exit(1);
          ' "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx --yes firebase-tools@13 deploy --only database --project superlig-208e3 --non-interactive > "$RUNNER_TEMP/cikti.txt" 2>&1
          kod=$?
          set -e
          cat "$RUNNER_TEMP/cikti.txt"
          if [ $kod -ne 0 ]; then echo "::error::Firebase yayini basarisiz: $(grep -i -m3 -E 'error|denied|permission|invalid' "$RUNNER_TEMP/cikti.txt" | tr '\n' ' ' | cut -c1-400)"; exit 1; fi
      - name: Yayinlanan kurallari Firebase'den geri oku ve karsilastir
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd "$RUNNER_TEMP" && npm i --silent google-auth-library@9 >/dev/null 2>&1
          node -e '
            const {GoogleAuth}=require("google-auth-library"); const fs=require("fs");
            (async()=>{
              const auth=new GoogleAuth({credentials:JSON.parse(process.env.SA),scopes:["https://www.googleapis.com/auth/firebase.database","https://www.googleapis.com/auth/userinfo.email"]});
              const tok=(await (await auth.getClient()).getAccessToken()).token;
              const r=await fetch("https://superlig-208e3-default-rtdb.europe-west1.firebasedatabase.app/.settings/rules.json",{headers:{Authorization:"Bearer "+tok}});
              const metin=await r.text();
              if(!r.ok){ console.log("::error::Kurallar okunamadi: HTTP "+r.status+" "+metin.slice(0,200)); process.exit(1); }
              const temiz=t=>JSON.stringify(JSON.parse(t.replace(/\/\/.*$/mg,"")));
              const ayni=temiz(metin)===temiz(fs.readFileSync(process.env.GITHUB_WORKSPACE+"/database.rules.json","utf8"));
              const dal=metin.includes("_dalKaydi");
              console.log((ayni?"::notice::":"::error::")+"Firebase kurallari depodakiyle "+(ayni?"BIREBIR AYNI":"FARKLI")+" | _dalKaydi "+(dal?"VAR":"YOK")+" | anahtar "+String(JSON.parse(process.env.SA).private_key_id||"").slice(0,8)+" | "+new Date().toISOString());
              if(!ayni) process.exit(1);
            })().catch(e=>{ console.log("::error::"+e.message); process.exit(1); });
          '
