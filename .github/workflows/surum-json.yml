# HTML dosyaları her yüklendiğinde (elle de olsa) surum.json'u günceller; uygulamalar "yeni sürüm yüklendi" ekranını buna göre gösterir.
name: Surum dosyasi
on:
  push:
    branches: [main]
    paths: ['index.html', 'admin.html', 'saha.html', 'test/index.html', 'test/admin.html', 'test/saha.html']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: surum-json
  cancel-in-progress: false
jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: surum.json uret ve gonder
        run: |
          node .github/scripts/surum-uret.js
          if [ -n "$(git status --porcelain -- surum.json test/surum.json)" ]; then
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git add surum.json test/surum.json && git commit -qm "surum.json guncellendi"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
