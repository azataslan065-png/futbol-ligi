# Uygulama Merkezi: geliştiricilerin telefondan yüklediği dosyaları (APK, ikon, ekran görüntüsü, video) GitHub'a aktarır.
# 5 dakikada bir başlar ve yaklaşık 4,5 dakika boyunca 15 saniyede bir bakar; böylece yükleme genelde 1-2 dakikada yayına girer.
name: Uygulama Merkezi gelistirici dosyalari
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/um-gelistirici.yml, .github/scripts/um-gelistirici.js]
concurrency:
  group: um-gelistirici
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  aktar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dosyalari aktar
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP" && npm i --silent firebase-admin@12 >/dev/null 2>&1
          NODE_PATH="$RUNNER_TEMP/node_modules" node "$GITHUB_WORKSPACE/.github/scripts/um-gelistirici.js"
