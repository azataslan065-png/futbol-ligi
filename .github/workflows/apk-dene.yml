# APK'ları emülatörde iki kez açıp ekran görüntüsü ve günlük alır; sonuç "apk-dene" dalına yazılır.
name: APK dene
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/apk-dene.yml]
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: APK indir
        env: { GH_TOKEN: '${{ github.token }}' }
        run: mkdir -p /tmp/a && gh release download apk -R ${{ github.repository }} -D /tmp/a && ls -la /tmp/a
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p /tmp/r; adb logcat -c; adb install -r /tmp/a/Puan-Tablosu.apk; adb install -r /tmp/a/SAHA-Admin.apk; adb install -r /tmp/a/SAHA.apk; adb install -r /tmp/a/Puan-Tablosu-Kok.apk; adb install -r /tmp/a/Admin-Kok.apk
            for p in com.azat.puantablosukok com.azat.adminkok; do adb shell monkey -p $p -c android.intent.category.LAUNCHER 1 >/dev/null; sleep 25; adb exec-out screencap -p > /tmp/r/$p-1.png; adb shell input keyevent KEYCODE_BACK; sleep 3; adb exec-out screencap -p > /tmp/r/$p-geri1.png; adb shell input keyevent KEYCODE_BACK; sleep 3; adb exec-out screencap -p > /tmp/r/$p-geri2.png; adb shell input keyevent KEYCODE_BACK; sleep 2; adb shell input keyevent KEYCODE_BACK; sleep 3; adb shell monkey -p $p -c android.intent.category.LAUNCHER 1 >/dev/null; sleep 25; adb exec-out screencap -p > /tmp/r/$p-2.png; adb shell input keyevent KEYCODE_HOME; sleep 3; adb shell monkey -p $p -c android.intent.category.LAUNCHER 1 >/dev/null; sleep 12; adb exec-out screencap -p > /tmp/r/$p-3.png; adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumed" > /tmp/r/$p-akt.txt || true; adb shell am force-stop $p; done
            adb logcat -d | grep -iE "chromium|AndroidRuntime|azat|WebView|FATAL|console" | tail -800 > /tmp/r/logcat.txt || true
      - name: Sonucu yaz
        if: always()
        run: |
          cd /tmp/r && git init -q && git checkout -q -b apk-dene && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "APK dene $(date -u +%FT%TZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-dene
