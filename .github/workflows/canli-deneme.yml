# Canlı test sitesinde (GitHub Pages) SAHA'nın doğal spiker sesini ve müzik listesini gerçek tarayıcıda dener; sonucu
# "canli-deneme" dalına rapor olarak yazar. Yayın yapmaz.
name: Canli deneme
on:
  push:
    branches: [main]
    paths: [.github/workflows/canli-deneme.yml, .github/canli-deneme/**]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dene
        run: |
          mkdir -p /tmp/d && cd /tmp/d && npm init -y >/dev/null && npm i --silent playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/.github/canli-deneme/dene.js" . && node dene.js > rapor.txt 2>&1 || true
          cat rapor.txt
      - name: Rapor dalina yaz
        run: |
          cd /tmp/d && mkdir r && cp rapor.txt r/ && cp *.png r/ 2>/dev/null || true; cd r
          git init -q && git checkout -q -b canli-deneme && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "Canli deneme $(date -u +%FT%TZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" canli-deneme
