# SAHA, Puan Tablosu ve Admin APK'ları. Kabuk değişince (android/) ya da elle derlenir; APK'lar "apk" sürümüne yüklenir.
name: APK
on:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/apk.yml, .github/apk/**]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Imza anahtari
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node .github/scripts/anahtar-onar.js "$RUNNER_TEMP/sa.json" >/dev/null 2>&1 || true
          mkdir -p /tmp/k && cd /tmp/k && npm init -y >/dev/null && npm i --silent google-auth-library@9 >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/.github/apk/anahtar.js" . && node anahtar.js
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Derle
        working-directory: android
        run: gradle assembleRelease --no-daemon -q 2>&1 | tail -40
      - name: Yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp android/app/build/outputs/apk/saha/release/*.apk out/SAHA.apk
          cp android/app/build/outputs/apk/puan/release/*.apk out/Puan-Tablosu.apk
          cp android/app/build/outputs/apk/admin/release/*.apk out/SAHA-Admin.apk
          cp android/app/build/outputs/apk/kokpuan/release/*.apk out/Puan-Tablosu-Kok.apk
          cp android/app/build/outputs/apk/kokadmin/release/*.apk out/Admin-Kok.apk
          ls -la out
          gh release delete apk -y --cleanup-tag 2>/dev/null || true
          gh release create apk out/*.apk --title "APK (derleme $GITHUB_RUN_NUMBER)" --notes "Test: SAHA, Puan Tablosu Test, SAHA Admin Test. Kök (canlı): Puan Tablosu, Admin Paneli. Telefona indirip kur; yeni sürüm eskisinin üstüne kurulur." --latest
          rm -f "$KS_YOL"
