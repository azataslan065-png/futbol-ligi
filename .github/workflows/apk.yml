# SAHA, Puan Tablosu ve Admin APK'ları. Kabuk değişince (android/) ya da elle derlenir; APK'lar "apk" sürümüne yüklenir.
name: APK
on:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/apk.yml, .github/apk/**, test/saha.html, test/index.html, test/admin.html]   # (2026-11-07) sayfalar APK'ya gömülü: her sayfa yüklemesi yeni APK
  workflow_dispatch:
permissions:
  contents: write
jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Imza anahtari
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node .github/scripts/anahtar-onar.js "$RUNNER_TEMP/sa.json" >/dev/null 2>&1 || true
          mkdir -p /tmp/k && cd /tmp/k && npm init -y >/dev/null && npm i --silent google-auth-library@9 >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/.github/apk/anahtar.js" . && node anahtar.js
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Derle
        working-directory: android
        run: gradle assembleRelease --no-daemon -q 2>&1 | tail -40
      - name: Yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp android/app/build/outputs/apk/saha/release/*.apk out/SAHA.apk
          cp android/app/build/outputs/apk/puan/release/*.apk out/Puan-Tablosu.apk
          cp android/app/build/outputs/apk/admin/release/*.apk out/SAHA-Admin.apk
          cp android/app/build/outputs/apk/kokpuan/release/*.apk out/Puan-Tablosu-Kok.apk
          cp android/app/build/outputs/apk/kokadmin/release/*.apk out/Admin-Kok.apk
          # Güncelleme bilgisi (bkz. android Guncelle.java): uygulama başına derleme no, sürüm adı, APK adresi ve notlar.
          U="https://github.com/${{ github.repository }}/releases/download/apk"; K=$(cat android/kok-surum.txt | tr -d '[:space:]'); N=$GITHUB_RUN_NUMBER
          NOT=$(node -e 'process.stdout.write(JSON.stringify(require("fs").readFileSync("android/kok-notlar.txt","utf8").trim()))')
          T=$(date +%s000); b(){ stat -c%s "out/$1"; }
          d(){ grep -o "window.APP_BUILD='[^']*'" "test/$1.html" | head -1 | cut -d"'" -f2; }; DS=$(d saha); DP=$(d index); DA=$(d admin)
          cat > out/surum.json <<EOF2
          {"saha":{"kod":$N,"ad":"$DS","url":"$U/SAHA.apk","boyut":$(b SAHA.apk),"tarih":$T,"not":"Test sürümü","zorunlu":true},
           "puan":{"kod":$N,"ad":"$DP","url":"$U/Puan-Tablosu.apk","boyut":$(b Puan-Tablosu.apk),"tarih":$T,"not":"Test sürümü","zorunlu":true},
           "admin":{"kod":$N,"ad":"$DA","url":"$U/SAHA-Admin.apk","boyut":$(b SAHA-Admin.apk),"tarih":$T,"not":"Test sürümü","zorunlu":true},
           "kokpuan":{"kod":$N,"ad":"$K","url":"$U/Puan-Tablosu-Kok.apk","boyut":$(b Puan-Tablosu-Kok.apk),"tarih":$T,"not":$NOT,"zorunlu":true},
           "kokadmin":{"kod":$N,"ad":"$K","url":"$U/Admin-Kok.apk","boyut":$(b Admin-Kok.apk),"tarih":$T,"not":$NOT,"zorunlu":true}}
          EOF2
          node -e 'JSON.parse(require("fs").readFileSync("out/surum.json","utf8"))' && cat out/surum.json
          ls -la out
          gh release delete apk -y --cleanup-tag 2>/dev/null || true
          gh release create apk out/*.apk out/surum.json --title "APK (derleme $GITHUB_RUN_NUMBER)" --notes "Test: SAHA, Puan Tablosu Test, SAHA Admin Test. Kök (canlı): Puan Tablosu, Admin Paneli. Telefona indirip kur; yeni sürüm eskisinin üstüne kurulur." --latest
          rm -f "$KS_YOL"
