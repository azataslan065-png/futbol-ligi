# Güncelleme sisteminin uçtan uca denemesi: eski derleme numarasıyla (1) bir Puan Tablosu Test APK'sı derlenir, emülatöre kurulur ve açılır;
# uygulama yayındaki surum.json'u okuyup "Yeni sürüm" penceresini göstermeli, Güncelle'ye basınca indirip kurulum/izin ekranını açmalı.
# Ekran görüntüleri "apk-guncelle-dene" dalına yazılır. Yayına bir şey yüklemez.
name: APK guncelleme dene
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/apk-guncelle-dene.yml]
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Imza anahtari
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node .github/scripts/anahtar-onar.js "$RUNNER_TEMP/sa.json" >/dev/null 2>&1 || true
          mkdir -p /tmp/k && cd /tmp/k && npm init -y >/dev/null && npm i --silent google-auth-library@9 >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/.github/apk/anahtar.js" . && node anahtar.js
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Eski surum derle
        working-directory: android
        run: GITHUB_RUN_NUMBER=1 gradle assemblePuanRelease --no-daemon -q 2>&1 | tail -20; cp app/build/outputs/apk/puan/release/*.apk /tmp/eski.apk; rm -f "$KS_YOL"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p /tmp/r; adb uninstall com.azat.puantablosu >/dev/null 2>&1 || true; adb install -r /tmp/eski.apk; adb shell dumpsys package com.azat.puantablosu | grep -E "versionName|versionCode" > /tmp/r/surum-once.txt
            adb shell monkey -p com.azat.puantablosu -c android.intent.category.LAUNCHER 1 >/dev/null; sleep 30; adb exec-out screencap -p > /tmp/r/1-pencere.png
            adb shell uiautomator dump /sdcard/u.xml >/dev/null; adb pull /sdcard/u.xml /tmp/r/u1.xml >/dev/null || true
            B=$(grep -o 'text="GÜNCELLE"[^>]*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' /tmp/r/u1.xml | grep -o '\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]' | head -1); echo "dugme $B" > /tmp/r/dugme.txt
            if [ -n "$B" ]; then X=$(echo $B | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\1 \3/' | awk '{print int(($1+$2)/2)}'); Y=$(echo $B | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\2 \4/' | awk '{print int(($1+$2)/2)}'); adb shell input tap $X $Y; fi
            sleep 25; adb exec-out screencap -p > /tmp/r/2-indirme.png
            adb shell uiautomator dump /sdcard/u.xml >/dev/null; adb pull /sdcard/u.xml /tmp/r/u2.xml >/dev/null || true
            adb shell appops set com.azat.puantablosu REQUEST_INSTALL_PACKAGES allow; adb shell input keyevent KEYCODE_BACK; sleep 3
            adb shell monkey -p com.azat.puantablosu -c android.intent.category.LAUNCHER 1 >/dev/null; sleep 8; adb exec-out screencap -p > /tmp/r/3-tekrar.png
            adb shell uiautomator dump /sdcard/u.xml >/dev/null; adb pull /sdcard/u.xml /tmp/r/u3.xml >/dev/null || true
            B=$(grep -o 'text="GÜNCELLE"[^>]*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' /tmp/r/u3.xml | grep -o '\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]' | head -1); echo "dugme2 $B" >> /tmp/r/dugme.txt
            if [ -n "$B" ]; then X=$(echo $B | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\1 \3/' | awk '{print int(($1+$2)/2)}'); Y=$(echo $B | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\2 \4/' | awk '{print int(($1+$2)/2)}'); adb shell input tap $X $Y; fi
            sleep 25; adb exec-out screencap -p > /tmp/r/4-kurulum.png
            adb shell uiautomator dump /sdcard/u.xml >/dev/null; adb pull /sdcard/u.xml /tmp/r/u4.xml >/dev/null || true
            adb logcat -d | grep -iE "azat|Guncelle|DownloadManager|PackageInstaller|FATAL|AndroidRuntime: (E|F)" | tail -300 > /tmp/r/logcat.txt || true
      - name: Sonucu yaz
        if: always()
        run: |
          cd /tmp/r && git init -q && git checkout -q -b apk-guncelle-dene && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "APK guncelleme dene $(date -u +%FT%TZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-guncelle-dene
