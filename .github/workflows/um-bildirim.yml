# Uygulama Merkezi: yönetici panelinden kuyruğa eklenen bildirimleri davetlilerin telefonlarına gönderir.
# 5 dakikada bir çalışır (GitHub zamanlanmış görevleri birkaç dakika gecikebilir). Kuyruk boşsa hemen biter.
name: Uygulama Merkezi bildirimleri
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/um-bildirim.yml, .github/scripts/um-bildirim.js]
concurrency:
  group: um-bildirim
  cancel-in-progress: false
jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kuyrugu isle
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd "$RUNNER_TEMP" && npm i --silent firebase-admin@12 >/dev/null 2>&1
          NODE_PATH="$RUNNER_TEMP/node_modules" node "$GITHUB_WORKSPACE/.github/scripts/um-bildirim.js"
