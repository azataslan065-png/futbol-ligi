# Kupa agaci kalintisi temizligi - YALNIZCA test veritabani (lig formati league, maclarda penalti/uzatma alanlari silinir). Rapor "kupa-temizle-rapor" dalina.
name: Kupa kalintisi temizle (test)
on:
  push:
    branches: [main]
    paths: [.github/workflows/kupa-temizle.yml, .github/ligkural/temizle.js]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  temizle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Temizle
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node .github/scripts/anahtar-onar.js "$RUNNER_TEMP/sa.json" >/dev/null 2>&1 || true
          mkdir -p /tmp/t && cd /tmp/t && npm init -y >/dev/null && npm i --silent google-auth-library@9 >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/.github/ligkural/temizle.js" . && node temizle.js > rapor.txt 2>&1 || true
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Rapor dalina yaz
        run: |
          mkdir /tmp/r && cp /tmp/t/rapor.txt /tmp/r/ && cd /tmp/r
          git init -q && git checkout -q -b kupa-temizle-rapor && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "Kupa temizle $(date -u +%FT%TZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kupa-temizle-rapor
