# Test ortamında zorunlu güncelleme sürümünü (test/globalConfig/minSurum) elle yazar. Yalnızca elle çalıştırılır.
name: Zorunlu surum yaz (test)
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Zorunlu sürüm (YYYY-AA-GG-HARF)"
        required: true
jobs:
  yaz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Yaz
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BUILD: ${{ github.event.inputs.build }}
        run: |
          echo "$BUILD" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}-[A-Z]+$'
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node .github/scripts/anahtar-onar.js "$RUNNER_TEMP/sa.json" >/dev/null 2>&1 || true
          mkdir -p /tmp/t && cd /tmp/t && npm init -y >/dev/null && npm i --silent google-auth-library@9 >/dev/null 2>&1
          cat > yaz.js <<'JS'
          const { GoogleAuth } = require('google-auth-library'); const fs = require('fs');
          (async () => {
            let t = fs.readFileSync(process.env.RUNNER_TEMP + '/sa.json', 'utf8'), SAJ; try{ SAJ = JSON.parse(t); }catch(e){ SAJ = JSON.parse(t.replace(/\r?\n/g, '\\n')); }
            const auth = new GoogleAuth({ credentials: SAJ, scopes: ['https://www.googleapis.com/auth/firebase.database', 'https://www.googleapis.com/auth/userinfo.email'] });
            const tok = (await (await auth.getClient()).getAccessToken()).token;
            const r = await fetch('https://superlig-208e3-default-rtdb.europe-west1.firebasedatabase.app/test/globalConfig/minSurum.json', { method:'PUT', headers:{ Authorization:'Bearer ' + tok, 'Content-Type':'application/json' }, body:JSON.stringify({ build:process.env.BUILD, mesaj:null, ts:Date.now() }) });
            console.log(r.status, await r.text());
          })();
          JS
          node yaz.js
          rm -f "$RUNNER_TEMP/sa.json"
