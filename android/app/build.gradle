plugins { id 'com.android.application' }
def KOK = 'https://azataslan065-png.github.io/futbol-ligi/test/'
def KOK_SURUM = file('../kok-surum.txt').text.trim()   // kök uygulamaların sürüm adı (ör. 1.4.0); değişince kullanıcıya güncelleme sunulur
def CANLI = 'https://azataslan065-png.github.io/futbol-ligi/'   // kök (canlı) sürüm: yalnızca Puan Tablosu ve Admin
android {
    namespace 'com.azat.saha'
    compileSdk 35
    defaultConfig {
        minSdk 24
        targetSdk 34      // 35 kenardan kenara zorlar; sayfalar sistem çubuklarının altına kayardı
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName 'test.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')   // test uygulamaları: her derleme yeni sürüm
    }
    signingConfigs {
        imza {
            storeFile file(System.getenv('KS_YOL') ?: 'yok.jks')
            storePassword System.getenv('KS_SIFRE') ?: ''
            keyAlias 'saha'
            keyPassword System.getenv('KS_SIFRE') ?: ''
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.imza } }
    flavorDimensions = ['uyg']
    productFlavors {
        saha  { dimension 'uyg'; applicationId 'com.azat.saha';       resValue 'string', 'app_name', 'SAHA';         buildConfigField 'String', 'ADRES', "\"${KOK}saha.html\"";  buildConfigField 'boolean', 'YATAY', 'true' }
        puan  { dimension 'uyg'; applicationId 'com.azat.puantablosu'; resValue 'string', 'app_name', 'Puan Tablosu Test'; buildConfigField 'String', 'ADRES', "\"${KOK}index.html\""; buildConfigField 'boolean', 'YATAY', 'false' }
        admin { dimension 'uyg'; applicationId 'com.azat.sahaadmin';  resValue 'string', 'app_name', 'SAHA Admin Test'; buildConfigField 'String', 'ADRES', "\"${KOK}admin.html\""; buildConfigField 'boolean', 'YATAY', 'false' }
        kokpuan  { dimension 'uyg'; applicationId 'com.azat.puantablosukok'; versionName KOK_SURUM; resValue 'string', 'app_name', 'Puan Tablosu'; buildConfigField 'String', 'ADRES', "\"${CANLI}index.html\""; buildConfigField 'boolean', 'YATAY', 'false' }
        kokadmin { dimension 'uyg'; applicationId 'com.azat.adminkok'; versionName KOK_SURUM;       resValue 'string', 'app_name', 'Admin Paneli'; buildConfigField 'String', 'ADRES', "\"${CANLI}admin.html\""; buildConfigField 'boolean', 'YATAY', 'false' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
