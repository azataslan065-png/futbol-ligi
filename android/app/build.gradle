plugins { id 'com.android.application' }
def KOK = 'https://azataslan065-png.github.io/futbol-ligi/test/'
android {
    namespace 'com.azat.saha'
    compileSdk 35
    defaultConfig {
        minSdk 24
        targetSdk 34      // 35 kenardan kenara zorlar; sayfalar sistem çubuklarının altına kayardı
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }
    signingConfigs {
        imza {
            storeFile file(System.getenv('KS_YOL') ?: 'yok.jks')
            storePassword System.getenv('KS_SIFRE') ?: ''
            keyAlias 'saha'
            keyPassword System.getenv('KS_SIFRE') ?: ''
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.imza } }
    flavorDimensions = ['uyg']
    productFlavors {
        saha  { dimension 'uyg'; applicationId 'com.azat.saha';       resValue 'string', 'app_name', 'SAHA';         buildConfigField 'String', 'ADRES', "\"${KOK}saha.html\"";  buildConfigField 'boolean', 'YATAY', 'true' }
        puan  { dimension 'uyg'; applicationId 'com.azat.puantablosu'; resValue 'string', 'app_name', 'Puan Tablosu'; buildConfigField 'String', 'ADRES', "\"${KOK}index.html\""; buildConfigField 'boolean', 'YATAY', 'false' }
        admin { dimension 'uyg'; applicationId 'com.azat.sahaadmin';  resValue 'string', 'app_name', 'SAHA Admin';   buildConfigField 'String', 'ADRES', "\"${KOK}admin.html\""; buildConfigField 'boolean', 'YATAY', 'false' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
