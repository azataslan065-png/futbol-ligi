plugins { id 'com.android.application' }
def KOK = 'https://azataslan065-png.github.io/futbol-ligi/test/'
def KOK_SURUM = file('../kok-surum.txt').text.trim()   // kök uygulamaların sürüm adı (ör. 1.4.0); değişince kullanıcıya güncelleme sunulur
def CANLI = 'https://azataslan065-png.github.io/futbol-ligi/'   // kök (canlı) sürüm: yalnızca Puan Tablosu ve Admin
// (2026-11-07) Test uygulamalarında sayfa APK'ya gömülür (bkz. Sayfa.java); sürüm adı sayfanın sürüm damgasıdır (APP_BUILD, ör. 2026-11-07-K).
def SAYFA = [saha:'saha', puan:'index', admin:'admin']
def damga = { String ad -> def m = (file("../../test/${ad}.html").getText('UTF-8') =~ /window\.APP_BUILD='([^']+)'/); m.find() ? m.group(1) : 'test' }
SAYFA.each { fl, ad -> def d = file("build/sayfa/${fl}"); d.mkdirs(); new File(d, 'sayfa.html').bytes = file("../../test/${ad}.html").bytes }
android {
    namespace 'com.azat.saha'
    compileSdk 35
    defaultConfig {
        minSdk 24
        targetSdk 34      // 35 kenardan kenara zorlar; sayfalar sistem çubuklarının altına kayardı
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName 'test.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')   // test uygulamaları: her derleme yeni sürüm
    }
    signingConfigs {
        imza {
            storeFile file(System.getenv('KS_YOL') ?: 'yok.jks')
            storePassword System.getenv('KS_SIFRE') ?: ''
            keyAlias 'saha'
            keyPassword System.getenv('KS_SIFRE') ?: ''
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.imza } }
    flavorDimensions = ['uyg']
    productFlavors {
        saha  { dimension 'uyg'; versionName damga('saha'); buildConfigField 'boolean', 'GOMULU', 'true'; applicationId 'com.azat.saha';       resValue 'string', 'app_name', 'Saha Test';         buildConfigField 'String', 'ADRES', "\"${KOK}saha.html\"";  buildConfigField 'boolean', 'YATAY', 'true' }
        puan  { dimension 'uyg'; versionName damga('index'); buildConfigField 'boolean', 'GOMULU', 'true'; applicationId 'com.azat.puantablosu'; resValue 'string', 'app_name', 'Puan Tablosu Test'; buildConfigField 'String', 'ADRES', "\"${KOK}index.html\""; buildConfigField 'boolean', 'YATAY', 'false' }
        admin { dimension 'uyg'; versionName damga('admin'); buildConfigField 'boolean', 'GOMULU', 'true'; applicationId 'com.azat.sahaadmin';  resValue 'string', 'app_name', 'Admin Test'; buildConfigField 'String', 'ADRES', "\"${KOK}admin.html\""; buildConfigField 'boolean', 'YATAY', 'false' }
        kokpuan  { dimension 'uyg'; buildConfigField 'boolean', 'GOMULU', 'false'; applicationId 'com.azat.puantablosukok'; versionName KOK_SURUM; resValue 'string', 'app_name', 'Puan Tablosu'; buildConfigField 'String', 'ADRES', "\"${CANLI}index.html\""; buildConfigField 'boolean', 'YATAY', 'false' }
        kokadmin { dimension 'uyg'; buildConfigField 'boolean', 'GOMULU', 'false'; applicationId 'com.azat.adminkok'; versionName KOK_SURUM;       resValue 'string', 'app_name', 'Admin'; buildConfigField 'String', 'ADRES', "\"${CANLI}admin.html\""; buildConfigField 'boolean', 'YATAY', 'false' }
    }
    sourceSets { SAYFA.each { fl, ad -> getByName(fl).assets.srcDirs = ["build/sayfa/${fl}"] } }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
