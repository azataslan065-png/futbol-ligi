<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAHA · Google ile giriş</title>
<meta name="robots" content="noindex">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% 0%,#12305a 0%,#070b16 60%);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8eefc;padding:16px}
.kart{width:100%;max-width:380px;background:rgba(14,22,40,.82);border:1px solid rgba(140,170,255,.18);border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
h1{font-size:22px;margin:0 0 6px;letter-spacing:.5px}
p{margin:8px 0;color:#aab6d3;font-size:14px}
button,a.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;padding:13px 16px;border-radius:12px;border:0;font:600 15px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.g{background:#fff;color:#1f1f1f}
.d{background:#2f7bff;color:#fff}
.hata{color:#ff9a9a}
.gizli{display:none}
</style></head>
<body>
<div class="kart">
  <h1>SAHA</h1>
  <p id="m">Google hesabını seç. Şifren bu sayfaya ya da uygulamaya gelmez.</p>
  <button class="g" id="gb" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Google ile devam et</button>
  <a class="btn d gizli" id="don" href="#">Uygulamaya dön</a>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
/* (2026-11-15-F) APK için Google girişi. Google, uygulama içi sayfa motorunda giriş yapılmasına izin vermediğinden uygulama bu sayfayı
   telefonun tarayıcısında açar. Google'ın verdiği kısa ömürlü kimlik belgesi uygulamanın kendi adresine (paket adı://google) gönderilir;
   uygulama belgeyi kendi oturumunda kullanır. Bu sayfada oturum saklanmaz; bağlı olmayan Google hesabı için açılan geçici hesap silinir. */
(function(){
  var q = new URLSearchParams(location.search), paket = q.get('d') || '', mod = q.get('m') || 'giris';
  var m = document.getElementById('m'), gb = document.getElementById('gb'), don = document.getElementById('don');
  if(!/^com\.azat\.[a-z]+$/.test(paket)){ m.textContent = 'Bu sayfa SAHA uygulamasından açılmalı.'; m.className = 'hata'; gb.classList.add('gizli'); return; }
  function adres(t, h){
    var y = 'google?m=' + encodeURIComponent(mod) + (t ? '&t=' + encodeURIComponent(t) : '') + (h ? '&h=' + encodeURIComponent(h) : '');
    return /android/i.test(navigator.userAgent) ? 'intent://' + y + '#Intent;scheme=' + paket + ';package=' + paket + ';end' : paket + '://' + y;
  }
  function gonder(t, h){ var u = adres(t, h); don.href = u; don.classList.remove('gizli'); try{ location.href = u; }catch(e){} }
  firebase.initializeApp({ apiKey:"AIzaSyDzWf2yD0rlOUJCSHkHJg-JLvBssX1dNUY", authDomain:"superlig-208e3.firebaseapp.com", projectId:"superlig-208e3", appId:"1:879221404148:web:daae84d7187311400209a1" });
  var a = firebase.auth(); try{ a.setPersistence(firebase.auth.Auth.Persistence.NONE); }catch(e){}
  gb.onclick = function(){
    gb.disabled = true; m.className = ''; m.textContent = 'Google açılıyor…';
    var p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt:'select_account' });
    a.signInWithPopup(p).then(function(s){
      var t = s && s.credential && s.credential.idToken;
      if(!t) throw { code:'kimlik-yok' };
      var yeni = s.additionalUserInfo && s.additionalUserInfo.isNewUser;
      return (yeni && s.user ? s.user.delete().catch(function(){}) : Promise.resolve()).then(function(){ return a.signOut().catch(function(){}); }).then(function(){
        m.textContent = 'Tamam. Uygulamaya dönülüyor…'; gonder(t, '');
      });
    }).catch(function(e){
      var k = String((e && e.code) || e || ''); gb.disabled = false;
      if(/popup-closed|cancelled/.test(k)){ m.textContent = 'Vazgeçildi. Tekrar deneyebilir ya da uygulamaya dönebilirsin.'; don.href = adres('', 'iptal'); don.classList.remove('gizli'); return; }
      m.className = 'hata';
      m.textContent = /operation-not-allowed|configuration-not-found/.test(k) ? 'Google ile giriş henüz açılmadı.' : /unauthorized-domain/.test(k) ? 'Bu adres Google girişine kayıtlı değil.' : 'Giriş yapılamadı (' + k.replace(/^auth\//, '') + ').';
      don.href = adres('', k.replace(/^auth\//, '') || 'hata'); don.classList.remove('gizli');
    });
  };
})();
</script>
</body></html>
